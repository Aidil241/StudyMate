<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KampusKu</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Simpan jadwal kuliah, tugas, materi, dan foto. Bisa offline.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="judul">Beranda</h1>
      <p id="subjudul" class="muted"></p>
    </div>
    <button id="btn-menu" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
  </header>

  <main id="app">
    <section id="view-beranda" class="view active"></section>
    <section id="view-jadwal" class="view"></section>
    <section id="view-tugas" class="view"></section>
    <section id="view-berkas" class="view"></section>
  </main>

  <button id="fab" class="fab" aria-label="Tambah">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button data-tab="beranda" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Beranda</span>
    </button>
    <button data-tab="jadwal">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Jadwal</span>
    </button>
    <button data-tab="tugas">
      <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Tugas</span>
    </button>
    <button data-tab="berkas">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>Berkas</span>
    </button>
  </nav>

  <!-- Dialog form / menu / pratinjau -->
  <dialog id="dlg"></dialog>

  <!-- Input file tersembunyi -->
  <input id="in-file" type="file" multiple hidden>
  <input id="in-foto" type="file" accept="image/*" capture="environment" hidden>
  <input id="in-import" type="file" accept="application/json,.json" hidden>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
